<html><head><meta charset="utf-8">
<style>

@font-face { font-family: M; src: url("../src/fonts/IBMPlexMono-Medium.woff2") format("woff2"); font-weight: 500; }
html,body{margin:0}
body{width:1200px;height:630px;background:#142042;color:#fff;font-family:S;position:relative;overflow:hidden;
 background-image:radial-gradient(rgba(140,170,255,.22) 1.2px, transparent 1.6px);background-size:22px 22px;background-position:11px 11px}

p{margin:26px 0 0;font-size:30px;line-height:1.35;color:#c9d2ea;max-width:760px}
